name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # No VITE_BASE: Cloudflare serves us at the ROOT, which is the whole point of moving
      # here. At the root, public/_headers is honoured — so the CSP becomes a real header
      # (with frame-ancestors) instead of a meta tag, and _redirects handles SPA deep links
      # instead of the 404.html copy trick. PLAN.md §0.0 A7 / ADR-0002.
      - run: npm run build

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=offbook --branch=main
