name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # No VITE_BASE: Cloudflare serves us at the ROOT, which is the whole point of moving
      # here. At the root, public/_headers is honoured — so the CSP becomes a real header
      # (with frame-ancestors) instead of a meta tag, and _redirects handles SPA deep links
      # instead of the 404.html copy trick. PLAN.md §0.0 A7 / ADR-0002.
      - run: npm run build

      # A stray newline or space in the account-id secret produces a baffling
      # "could not route to /accounts/.../pages/projects [code: 7003]" — the id lands in a
      # URL path, so any whitespace corrupts the route rather than failing auth. Strip it
      # here so a copy-paste slip can never cost another debugging round.
      - name: Normalise the account id
        env:
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACC=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '[:space:]')
          if [ ${#ACC} -ne 32 ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is ${#ACC} characters after trimming; a Cloudflare account id is exactly 32 hex characters. Check the secret."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"

      # Fail before deploying rather than after, if the D1 id was never filled in — otherwise
      # the site goes live with a working sign-in button in front of a broken backend, which
      # is worse than not shipping the feature at all.
      - name: Check the D1 binding is configured
        run: |
          if grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the placeholder database_id. Run 'npx wrangler d1 create offbook' and paste the id, or the /api routes will 500 in production."
            exit 1
          fi

      # Cloudflare's own error for a credential problem is "could not route ... code 7003",
      # which reads like a missing project, so check up front and fail with something useful.
      #
      # This deliberately does NOT use /user/tokens/verify: that endpoint only accepts *User*
      # API tokens and returns code 1000 "Invalid API Token" for a perfectly valid
      # Account-Owned token. Using it cost a debugging round chasing a token that was fine.
      # Listing Pages projects instead exercises the exact permission the deploy needs, so it
      # cannot report a false failure.
      - name: Check the API token can reach Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          body=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?per_page=1")
          # Whitespace-tolerant: Cloudflare pretty-prints, so the body says '"success": true'
          # with a space. Matching the unspaced form failed against a perfectly good response.
          if ! echo "$body" | grep -qE '"success":[[:space:]]*true'; then
            echo "Cloudflare said: $(echo "$body" | head -c 300)"
            echo "::error::CLOUDFLARE_API_TOKEN cannot list Pages projects for this account. Check it has Account -> Cloudflare Pages -> Edit and Account -> D1 -> Edit, and that CLOUDFLARE_ACCOUNT_ID is the right account."
            exit 1
          fi
          echo "token can reach Pages"

      # Migrations run before the deploy, so the schema is never behind the code that needs it.
      # Requires Account -> D1 -> Edit on the token, in addition to Pages -> Edit.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply offbook --remote

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=offbook --branch=main
