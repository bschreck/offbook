name: Deploy to GitHub Pages (fallback)

# Cloudflare Pages at the root is the canonical deploy (ADR-0002). This one is kept as a
# manual escape hatch only: it is NOT run on push, because two live origins would mean two
# separate IndexedDB libraries and a user could not tell which one held their texts.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub Pages project sites are served from a sub-path. PLAN.md §0.0 A7 — moving to a
      # root deploy later is this one env var, not a refactor.
      - run: npm run build
        env:
          VITE_BASE: /offbook/
      # Pages has no SPA fallback, so a deep link 404s unless index.html is also the 404 page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
